services:
  postgres:
    container_name: shiftly-postgres
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-shiftly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-shiftly}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - shiftly-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shiftly-postgres-data:
