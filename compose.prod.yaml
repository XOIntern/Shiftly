services:
  app:
    container_name: shiftly-app-prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-shiftly}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-shiftly}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: shiftly-postgres-prod
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-shiftly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-shiftly}
    volumes:
      - shiftly-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shiftly-postgres-data:
